# Once a day: updates the public demo's prices and exchange rates, then resets its
# purchases to the samples (visitors can change them in sandbox mode).
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   DEMO_DATABASE_URL   the Neon demo database, as postgresql+psycopg://...
#   METALS_DEV_API_KEY  the metals.dev key (about 1 request per run)
name: Update demo data

on:
  schedule:
    - cron: "30 22 * * *" # 22:30 UTC, after the Bank of Canada publishes the day's rate
  workflow_dispatch: # also allows running it by hand from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # setup-uv doesn't publish short tags like @v10, so an exact version is needed.
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync --frozen --no-dev
      - name: Update prices and exchange rates
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          METALS_DEV_API_KEY: ${{ secrets.METALS_DEV_API_KEY }}
        run: uv run --no-sync python -m app.update_data
      - name: Reset demo purchases to the samples
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          # The reset deletes all purchases, so it only runs when DEMO_MODE is set.
          DEMO_MODE: sandbox
        run: uv run --no-sync python -m app.reset_demo
