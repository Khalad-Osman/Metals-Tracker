# Runs on every push and pull request: backend tests on SQLite and PostgreSQL,
# and a frontend lint + production build.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]

    services:
      # Only used by the postgresql run. The password is for this throwaway
      # CI container, not a real secret.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: metals
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: metals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metals -d metals_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      # setup-uv doesn't publish short tags like @v10, so an exact version is needed.
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync

      - name: Run tests on SQLite
        if: matrix.database == 'sqlite'
        run: uv run pytest

      - name: Run tests on PostgreSQL
        if: matrix.database == 'postgresql'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://metals:ci-only-password@localhost:5432/metals_test
        run: uv run pytest

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
