[project]
name = "metals-tracker-backend"
version = "0.1.0"
description = "FastAPI backend for the Metals Investment Tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
